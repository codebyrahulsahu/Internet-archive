# StreamHub — CI + GitHub Pages deploy
#
# 1. हर push/PR पर: lint (JS/HTML/CSS) + asset sanity check + एक छोटा smoke test
# 2. main पर merge होने पर: साइट GitHub Pages पर deploy हो जाती है
#    एक बार का setup ज़रूरी है: Repo Settings → Pages → Source: "GitHub Actions"
#    (GITHUB_TOKEN स्वयं Pages site enable नहीं कर सकता — GitHub limitation,
#     https://github.com/actions/configure-pages/issues/40 ;
#     वैकल्पिक: repo secret PAGES_PAT से auto-enable)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22 # jsdom's undici requires Node >= 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Validate HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Verify referenced assets exist
        run: npm run check

      - name: DOM smoke test (jsdom)
        run: npm test

      - name: Smoke test (serve & fetch)
        run: |
          python3 -m http.server 8080 &
          SERVER_PID=$!
          sleep 2
          for path in "/" "/css/style.css" "/js/archive.js" "/js/app.js" "/favicon.svg"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$path")
            if [ "$code" != "200" ]; then
              echo "::error::GET $path returned $code"
              kill $SERVER_PID || true
              exit 1
            fi
            echo "✓ GET $path -> $code"
          done
          kill $SERVER_PID || true

  deploy:
    name: Deploy to GitHub Pages
    needs: lint
    # सिर्फ main पर ही deploy हो — PRs से नहीं
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Pages site exists
        # GITHUB_TOKEN (GitHub App token) Pages site create नहीं कर सकता —
        # GitHub ने create/delete endpoints को apps के लिए block कर रखा है
        # (https://github.com/actions/configure-pages/issues/40), इसलिए यहाँ
        # पहले site enabled है या नहीं check करते हैं। नहीं है तो:
        #   - PAGES_PAT secret मौजूद है (user PAT) → उसके साथ enable करते हैं
        #   - वरना clear one-time setup instructions के साथ fail करते हैं
        env:
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          PAGE_JSON=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                       -H "Accept: application/vnd.github+json" "$API" 2>/dev/null) || PAGE_JSON=""
          if [ -n "$PAGE_JSON" ]; then
            BUILD_TYPE=$(echo "$PAGE_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build_type",""))' 2>/dev/null || true)
            if [ "$BUILD_TYPE" != "workflow" ]; then
              echo "::warning::Pages site exists but its source is not 'GitHub Actions'. Set Repo Settings → Pages → Source: 'GitHub Actions' or deploys will not publish."
            else
              echo "✓ Pages site already enabled (source: GitHub Actions)"
            fi
            exit 0
          fi
          echo "::notice::No Pages site found — enabling it before deploy."
          if [ -n "${PAGES_PAT:-}" ]; then
            # User-to-server tokens (PAT/OAuth) Pages sites create कर सकते हैं
            if ! curl -fsSL -X PUT \
              -H "Authorization: Bearer ${PAGES_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branch":"main","path":"/"}}' \
              "$API" > /dev/null; then
              echo "::error::Failed to enable Pages via PAGES_PAT — the secret may be expired or lack permissions."
              exit 1
            fi
            echo "✓ Enabled GitHub Pages via PAGES_PAT (source: GitHub Actions, branch: main)"
          else
            {
              echo "::error::GitHub Pages is not enabled for this repository."
              echo "The workflow GITHUB_TOKEN is not allowed to create Pages sites (GitHub limitation: https://github.com/actions/configure-pages/issues/40)."
              echo "One-time fix — do either, then re-run this workflow:"
              echo "  1. Repo Settings → Pages → Build and deployment → Source: 'GitHub Actions' (branch: main)."
              echo "  2. Add a repo secret PAGES_PAT (a user Personal Access Token with 'repo' scope) so the workflow can enable it automatically."
            }
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
