# StreamHub — CI + GitHub Pages deploy
#
# 1. हर push/PR पर: lint (JS/HTML/CSS) + asset sanity check + एक छोटा smoke test
# 2. main पर merge होने पर: साइट GitHub Pages पर deploy हो जाती है
#    एक बार का setup ज़रूरी है: Repo Settings → Pages → Source: "GitHub Actions"
#    (GITHUB_TOKEN स्वयं Pages site enable नहीं कर सकता — GitHub limitation,
#     https://github.com/actions/configure-pages/issues/40 ;
#     वैकल्पिक: repo secret PAGES_PAT से auto-enable)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22 # jsdom's undici requires Node >= 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Validate HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Verify referenced assets exist
        run: npm run check

      - name: DOM smoke test (jsdom)
        run: npm test

      - name: Smoke test (serve & fetch)
        run: |
          python3 -m http.server 8080 &
          SERVER_PID=$!
          sleep 2
          for path in "/" "/css/style.css" "/js/i18n.js" "/js/archive.js" "/js/app.js" "/favicon.svg"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$path")
            if [ "$code" != "200" ]; then
              echo "::error::GET $path returned $code"
              kill $SERVER_PID || true
              exit 1
            fi
            echo "✓ GET $path -> $code"
          done
          kill $SERVER_PID || true

  deploy:
    name: Deploy to GitHub Pages
    needs: lint
    # सिर्फ main पर ही deploy हो — PRs से नहीं
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Pages site exists
        # GITHUB_TOKEN (GitHub App token) Pages site create नहीं कर सकता —
        # GitHub ने create/delete endpoints को apps के लिए block कर रखा है
        # (https://github.com/actions/configure-pages/issues/40), इसलिए यहाँ
        # पहले site enabled है या नहीं check करते हैं। नहीं है तो:
        #   - PAGES_PAT secret मौजूद है (user PAT) → उसके साथ enable करते हैं
        #   - वरना deploy-pages को ही fail होने देते हैं (वह साफ़ error देता है)
        # NOTE: runner GITHUB_TOKEN को automatically env में export नहीं करता —
        # इसे explicitly map करना ज़रूरी है, वरना curl unauthorized जाएगा
        # और script को हमेशा "site नहीं मिली" दिखेगा।
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
        run: |
          set -euo pipefail
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          HTTP_CODE=$(curl -sSL -o /tmp/pages.json -w "%{http_code}" --retry 3 \
                       -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                       -H "Accept: application/vnd.github+json" \
                       "$API") || HTTP_CODE="000"
          if [ "$HTTP_CODE" = "200" ]; then
            BUILD_TYPE=$(python3 -c 'import json;print(json.load(open("/tmp/pages.json")).get("build_type",""))' 2>/dev/null || true)
            if [ "$BUILD_TYPE" != "workflow" ]; then
              echo "::warning::Pages site exists but its source is not 'GitHub Actions'. Set Repo Settings → Pages → Source: 'GitHub Actions' or deploys will not publish."
            else
              echo "✓ Pages site already enabled (source: GitHub Actions)"
            fi
            exit 0
          fi
          echo "::warning::Could not read Pages site status (HTTP $HTTP_CODE)."
          if [ -n "${PAGES_PAT:-}" ]; then
            # User-to-server tokens (PAT/OAuth) Pages sites create कर सकते हैं
            if ! curl -fsSL -X PUT \
              -H "Authorization: Bearer ${PAGES_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branch":"main","path":"/"}}' \
              "$API" > /dev/null; then
              echo "::error::Failed to enable Pages via PAGES_PAT — the secret may be expired or lack permissions."
              exit 1
            fi
            echo "✓ Enabled GitHub Pages via PAGES_PAT (source: GitHub Actions, branch: main)"
          else
            # Lookup fail होने पर deploy block मत करो — अगर site सच में नहीं है
            # तो actions/deploy-pages एक साफ़, actionable error के साथ fail होगा।
            echo "::notice::Continuing to deploy — if the Pages site is truly missing, actions/deploy-pages will fail with a clear message (fix: Repo Settings → Pages → Source: 'GitHub Actions', or add a PAGES_PAT secret)."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
